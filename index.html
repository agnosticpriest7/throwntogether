<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Thrown Together — Web development test</title>
  <style>
    html,body { margin:0; width:100%; height:100%; overflow:hidden; background:#101820; color:#eee; font:14px system-ui,sans-serif; }
    #web-host { width:100%; height:100%; display:flex; align-items:center; justify-content:center; flex-direction:column; background:#101820; }
    #game-frame { position:relative; flex:none; }
    canvas { display:block; width:100%; height:100%; outline:none; }
    #loading { position:absolute; inset:0; display:grid; place-content:center; text-align:center; background:#101820; padding:24px; }
    #web-tools { height:32px; width:100%; box-sizing:border-box; display:flex; align-items:center; justify-content:center; gap:12px; padding:2px 8px; }
    #focus-hint { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    button { color:#eee; background:#263740; border:1px solid #687b84; border-radius:3px; padding:3px 8px; white-space:nowrap; }
    button:focus-visible { outline:2px solid #a4e8d3; }
  </style>
</head>
<body>
  <main id="web-host">
    <div id="game-frame">
      <canvas id="unity-canvas" width="960" height="600" tabindex="0" aria-label="Thrown Together game"></canvas>
      <div id="loading" role="status">Loading Unity…</div>
    </div>
    <div id="web-tools">
      <span id="focus-hint" role="status">Click game / press A to focus</span>
      <button id="focus-game" type="button">Focus game</button>
      <button id="fullscreen" type="button">Fullscreen</button>
    </div>
  </main>
  <script src="web-shell.js"></script>
  <script>
    const canvas=document.getElementById("unity-canvas");
    const loading=document.getElementById("loading");
    const shell=ThrownTogetherWeb.attach(window,document);
    const config={
      dataUrl:"Build/ccbf07f87ce442db46484c934107ac9c.data",
      frameworkUrl:"Build/f064632c541e6756a98f12a9a267c5b2.framework.js",
      codeUrl:"Build/881197c76d1d5106e889c4bc6af8dba3.wasm",
      streamingAssetsUrl:"StreamingAssets",
      companyName:"DefaultCompany",
      productName:"ThrownTogetherUnity",
      productVersion:"0.1.0",
      matchWebGLToCanvasSize:true,
      showBanner:(message,type)=>{ if(type==="error") { loading.style.display="grid"; loading.textContent=message; } else console.warn(message); }
    };
    const loader=document.createElement("script");
    loader.src="Build/c8257f66f193baa1d0e1c7d6e245fd11.loader.js";
    loader.onerror=()=>{ loading.textContent="Unity loader could not download. Refresh this page to retry."; };
    loader.onload=()=>createUnityInstance(canvas,config,p=>{loading.textContent="Loading Unity… "+Math.round(p*100)+"%";})
      .then(()=>{ loading.style.display="none"; shell.ready(); })
      .catch(error=>{ loading.style.display="grid"; loading.textContent="Build failed to load: "+error; console.error(error); });
    document.body.appendChild(loader);
  </script>
</body>
</html>
